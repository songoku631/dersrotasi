substitutions:
  _VITE_API_BASE_URL: "https://dersrotasi-backend-233017262289.europe-west1.run.app"
  _SERVICE: "derspilot"
  _REGION: "europe-west1"
  _REPOSITORY: "cloud-run-source-deploy"

steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    secretEnv:
      - "FIREBASE_WEB_CONFIG"
    args:
      - "-ceu"
      - |
        set -o pipefail
        set -a
        source <(printf '%s\n' "$$FIREBASE_WEB_CONFIG")
        set +a
        docker build \
          --build-arg "VITE_API_BASE_URL=${_VITE_API_BASE_URL}" \
          --build-arg "VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY" \
          --build-arg "VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN" \
          --build-arg "VITE_FIREBASE_PROJECT_ID=$$VITE_FIREBASE_PROJECT_ID" \
          --build-arg "VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET" \
          --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg "VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID" \
          --tag "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}" \
          .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--quiet"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: "projects/${PROJECT_ID}/secrets/derspilot-firebase-web-config/versions/1"
      env: "FIREBASE_WEB_CONFIG"
